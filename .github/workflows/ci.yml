name: CI

# Run on every push to main and on every pull request.
on:
  push:
    branches: [main]
  pull_request:

# The job only reads the code; it never needs to write to the repo.
permissions:
  contents: read

# A newer push to the same branch cancels the older run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Caches Gradle downloads between runs so later builds are faster.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Compiles the code and runs all tests; a failing test fails the run.
      - name: Build and test
        run: ./gradlew build

      # Keep the HTML test report when something fails, so it can be read later.
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
